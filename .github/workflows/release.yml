name: Release ClassManager

# =============================================================================
# v* tag 触发，三平台并行构建，汇总发布到 GitHub Release。
#
# 全部构建相关逻辑集中在 ./scripts/run_tools.sh build（自动按当前 runner 平台分派）：
#   - 构建依赖准备：Linux apt 装 CGO 工具链 + GTK3 + WebKit2GTK(4.0) + zip；
#     macOS 校验 clang (Xcode CLT)；Windows 无需 CGO（WebView2 由系统提供）
#   - 打包：macOS darwin/universal → .app → .dmg；Linux zip；Windows zip
# 本 workflow 只做 runner 引导（checkout、Go 工具链与缓存）与产物上传，不写任何
# 系统依赖 / wails / hdiutil / zip 细节，避免与本地行为漂移。
#
# 注意：macOS runner 固定 macos-15。macos-latest 已切到 macOS 26，其 dyld 会拒绝加载
#   Go 1.22 链接器生成的缺失 LC_UUID 的二进制（run_tools.sh 已用 -B gobuildid 规避，
#   但仍建议锁定稳定 runner）。
# =============================================================================

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-macos:
    name: macOS (universal)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true
          cache-dependency-path: go.sum

      # run_tools.sh 内部完成：安装 wails CLI + 校验 clang → wails build (darwin/universal)
      #   → 同步 config.json → 修复 Info.plist → hdiutil 生成 DMG
      - name: Build & package via run_tools.sh
        run: |
          chmod +x ./scripts/run_tools.sh
          ./scripts/run_tools.sh build

      - name: List artifacts
        run: ls -lh release/

      - uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: release/ClassManager_v*.dmg

  build-linux:
    name: Linux (amd64)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true
          cache-dependency-path: go.sum

      # run_tools.sh 内部完成：apt 安装 CGO 工具链 + GTK3/WebKit2GTK → 安装 wails CLI
      #   → wails build (linux/amd64) → zip 打包（含 configs/）
      - name: Build & package via run_tools.sh
        run: |
          chmod +x ./scripts/run_tools.sh
          ./scripts/run_tools.sh build

      - name: List artifacts
        run: ls -lh release/

      - uses: actions/upload-artifact@v4
        with:
          name: linux-zip
          path: release/ClassManager_v*linux*.zip

  build-windows:
    name: Windows (amd64)
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true
          cache-dependency-path: go.sum

      # run_tools.sh 内部完成：安装 wails CLI → wails build (windows/amd64) → zip 打包
      - name: Build & package via run_tools.sh
        run: |
          chmod +x ./scripts/run_tools.sh
          ./scripts/run_tools.sh build

      - name: List artifacts
        run: ls -lh release/

      - uses: actions/upload-artifact@v4
        with:
          name: windows-zip
          path: release/ClassManager_v*windows*.zip

  release:
    name: Create GitHub Release
    needs: [build-macos, build-linux, build-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true

      - name: List release assets
        run: ls -lhR release/

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Class Manager ${{ github.ref_name }}
          body: |
            ## Class Manager ${{ github.ref_name }}

            基于 Go + Wails v2 的跨平台班级管理桌面应用。
            构建逻辑由 `./scripts/run_tools.sh build` 统一实现。

            **下载说明:**
            - macOS: `ClassManager_v*.dmg` — universal (amd64 + arm64)，未做 Apple 公证，首次打开如被 Gatekeeper 拦截，请右键应用选择“打开”确认一次。
            - Linux: `ClassManager_v*linux*.zip` — 解压后运行 `./ClassManager`（需系统预装 `libgtk-3-0` 与 `libwebkit2gtk-4.0-37`）
            - Windows: `ClassManager_v*windows*.zip` — 解压后运行 `ClassManager.exe`（需 WebView2 Runtime，Win 10 1803+ 默认自带）
          files: |
            release/ClassManager_v*.dmg
            release/ClassManager_v*linux*.zip
            release/ClassManager_v*windows*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
