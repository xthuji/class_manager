name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            platform: darwin
            wails_platform: darwin/universal
            artifact: "*.dmg"
          - os: ubuntu-22.04
            platform: linux
            wails_platform: linux/amd64
            artifact: "*.zip"
          - os: windows-latest
            platform: windows
            wails_platform: windows/amd64
            artifact: "*.zip"

    name: Build (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true

      - name: Install Linux dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libwebkit2gtk-4.0-dev \
            build-essential \
            pkg-config \
            libglib2.0-dev \
            libsoup-3.0-dev \
            javascriptcoregtk-4.0-dev \
            zip

      - name: Verify toolchain versions
        shell: bash
        run: |
          go version

      - name: Build & Package
        shell: bash
        run: |
          chmod +x ./scripts/run_tools.sh
          ./scripts/run_tools.sh build

      - name: List artifacts
        shell: bash
        run: ls -lh release/

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Class Manager ${{ github.ref_name }}
          body: |
            ## Class Manager ${{ github.ref_name }}

            Auto-built desktop app for macOS (universal DMG), Windows (amd64 ZIP), and Linux (amd64 ZIP).

            - **macOS**: Double-click `.dmg` to install
            - **Windows**: Extract `.zip` and run `ClassManager.exe`
            - **Linux**: Extract `.zip` and run `./ClassManager`
          files: release/${{ matrix.artifact }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
